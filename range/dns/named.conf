options { directory "/var/cache/bind"; recursion yes; allow-query { any; }; };
zone "cipher.lab" {
    type master;
    file "/etc/bind/zones/db.cipher.lab";
    // AXFR refused to the attacker (10.10.0.x); allowed only from DMZ hosts.
    // The "trusted host" is therefore a DMZ box (e.g. dvwa) — reach it via the pivot.
    allow-transfer { 10.20.0.0/24; };
};
