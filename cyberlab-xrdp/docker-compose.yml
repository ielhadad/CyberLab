# CyberLab: segmented Internet / DMZ / LAN range on a single Docker host
# with Suricata IDS, Portainer GUI and an optional browser SOCKS proxy.
# Host: Kali or Ubuntu (Linux host networking is required for Suricata).
#
# Topology
#   internet 10.10.0.0/24 (br-inet)  attacker(.10) --- router(.254)
#   dmz      10.20.0.0/24 (br-dmz)   router(.254) --- juiceshop(.11), dvwa(.12)
#   lan      10.30.0.0/24 (br-lan)   dvwa(.12, dual-homed pivot) --- metasploitable(.20)
# Nothing is published on a public interface: only 127.0.0.1:9443, :1080 and :3389.

networks:
  internet:
    driver_opts:
      com.docker.network.bridge.name: br-inet
    ipam:
      config:
        - subnet: 10.10.0.0/24
  dmz:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-dmz
    ipam:
      config:
        - subnet: 10.20.0.0/24
  lan:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-lan
    ipam:
      config:
        - subnet: 10.30.0.0/24
  mgmt: {}   # Portainer only; no lab host is attached

volumes:
  suricata-logs:
  suricata-rules:
  portainer-data:

services:
  router:
    image: alpine:3.20
    container_name: router
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    mem_limit: 64m
    networks:
      internet: { ipv4_address: 10.10.0.254 }
      dmz:      { ipv4_address: 10.20.0.254 }
    command:
      - sh
      - -c
      - |
        command -v iptables >/dev/null || apk add --no-cache iptables >/dev/null
        iptables -F FORWARD; iptables -t nat -F POSTROUTING
        iptables -P FORWARD DROP
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        # Firewall policy: Internet -> DMZ web services only
        iptables -A FORWARD -s 10.10.0.0/24 -d 10.20.0.0/24 -p tcp -m multiport --dports 80,3000 -j ACCEPT
        iptables -A FORWARD -s 10.10.0.0/24 -d 10.20.0.0/24 -p icmp -j ACCEPT
        # DMZ hosts reply to the router, so they need no route changes
        iptables -t nat -A POSTROUTING -d 10.20.0.0/24 -j MASQUERADE
        echo "router ready"; exec tail -f /dev/null

  attacker:
    build: ./attacker              # custom image: Kali tools + XFCE desktop + XRDP
    container_name: attacker
    hostname: attacker
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    mem_limit: 3g                  # desktop + browser need more than 1536m
    shm_size: "1g"                 # Firefox/Burp need shared memory
    tty: true
    networks:
      internet: { ipv4_address: 10.10.0.10 }
    ports:
      - "127.0.0.1:1080:1080"      # served by the socks container (shares this netns)
      - "127.0.0.1:3389:3389"      # XRDP desktop, host-only. For remote students use "3389:3389".
    command:
      - bash
      - -c
      - |
        # start the XFCE-over-RDP desktop
        rm -f /var/run/xrdp/*.pid 2>/dev/null
        service dbus start
        /usr/sbin/xrdp-sesman
        /usr/sbin/xrdp
        # lab routing: reach the DMZ through the router
        ip route replace 10.20.0.0/24 via 10.10.0.254
        # nuclei templates (best effort; needs internet on first start)
        if command -v nuclei >/dev/null && [ ! -d "$HOME/nuclei-templates" ]; then
          nuclei -update-templates >/dev/null 2>&1 || true
        fi
        echo "attacker ready (RDP on 127.0.0.1:3389, root/cyberrange)"; exec tail -f /dev/null

  # Optional: lets a browser on the host reach the DMZ as the attacker (SOCKS5, no auth, host only)
  socks:
    image: serjs/go-socks5-proxy:latest
    container_name: socks
    restart: unless-stopped
    network_mode: "service:attacker"
    depends_on: [attacker]
    mem_limit: 64m
    environment:
      - REQUIRE_AUTH=false

  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    restart: unless-stopped
    mem_limit: 512m
    networks:
      dmz: { ipv4_address: 10.20.0.11 }

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    mem_limit: 256m
    networks:
      dmz: { ipv4_address: 10.20.0.12 }
      lan: { ipv4_address: 10.30.0.12 }

  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: metasploitable
    hostname: metasploitable
    restart: unless-stopped
    mem_limit: 512m
    tty: true
    command: sh -c "/bin/services.sh && tail -f /dev/null"
    networks:
      lan: { ipv4_address: 10.30.0.20 }

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host          # needed to sniff the lab bridges
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    mem_limit: 1g
    restart: unless-stopped
    depends_on: [router, dvwa, metasploitable]
    volumes:
      - suricata-logs:/var/log/suricata
      - suricata-rules:/var/lib/suricata
    # HOME_NET = protected segments, so the attacker (10.10.0.0/24) is EXTERNAL_NET
    command: >
      -i br-inet -i br-lan
      --set vars.address-groups.HOME_NET=[10.20.0.0/24,10.30.0.0/24]

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    mem_limit: 256m
    restart: unless-stopped
    networks: [mgmt]
    ports:
      - "127.0.0.1:9443:9443"   # host only; never expose to the lab or the internet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
